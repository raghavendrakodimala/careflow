name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt
            capstone-data-toolkit/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r ../capstone-data-toolkit/requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      # No API key is configured: every test uses fakes for the model. The data validator runs from
      # the toolkit folder against the committed data.
      - name: Tests
        run: python -m pytest tests
      - name: Data validator
        working-directory: capstone-data-toolkit
        run: python -m tests.validate_data --domain careflow
